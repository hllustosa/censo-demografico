services:
  mongo:
    image: mongo:6.0.16
    restart: unless-stopped
    # Single-node replica set enables multi-document transactions (outbox).
    # Auth is intentionally omitted for local DEVELOPMENT ONLY; enable auth+keyFile in real deployments.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - net
    healthcheck:
      test: mongosh --quiet --eval "db.hello().isWritablePrimary || db.hello().ismaster" | grep -q true
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  mongo-init:
    image: mongo:6.0.16
    restart: "no"
    depends_on:
      - mongo
    # Inline init avoids bind-mount path mismatches when Compose runs via a Docker socket from a devcontainer.
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        echo "Waiting for MongoDB..."
        until mongosh --host mongo --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 2; done
        STATUS="$$(mongosh --host mongo --quiet --eval 'try { rs.status().ok } catch (e) { 0 }' || true)"
        if [ "$$STATUS" = "1" ]; then
          echo "Replica set already initialized."
          exit 0
        fi
        echo "Initiating replica set rs0..."
        mongosh --host mongo --eval 'rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongo:27017" }]})'
        echo "Waiting for PRIMARY..."
        until mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 2; done
        echo "Replica set ready."
    networks:
      - net

  neo4j:
    image: neo4j:5.26.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/testtest}
    ports:
      - '7474:7474'
    networks:
      - net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '15672:15672'
    networks:
      - net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  people:
    build:
      context: ./src/microservices
      dockerfile: People.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: mongodb://mongo:27017/?replicaSet=rs0
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__PublisherOnly: "true"
      RabbitMqConnection__retryCount: 5
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  family:
    build:
      context: ./src/microservices
      dockerfile: FamilyTree.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__Username: neo4j
      Neo4j__Password: ${NEO4J_PASSWORD:-testtest}
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__QueueName: tree
      RabbitMqConnection__retryCount: 5
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - net
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  stats:
    build:
      context: ./src/microservices
      dockerfile: Statistics.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: mongodb://mongo:27017/?replicaSet=rs0
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__QueueName: statistics
      RabbitMqConnection__retryCount: 5
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  identity:
    build:
      context: ./src/microservices
      dockerfile: Identity.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: mongodb://mongo:27017/identitydb?replicaSet=rs0
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
      Identity__Admin__Email: ${Identity__Admin__Email:-admin@censo.local}
      Identity__Admin__Password: ${Identity__Admin__Password:?Identity__Admin__Password is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  front:
    build:
      context: ./src/frontend/Census.WebApp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - net
    depends_on:
      - identity
      - people
      - family
      - stats

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.106.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - net

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - net

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - '3000:3000'
    networks:
      - net
    depends_on:
      - prometheus

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - '16686:16686'
    networks:
      - net

networks:
  net:
    name: census
