services:
  mongo:
    image: mongo:6.0.16
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-guest}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-guest}
    ports:
      - '27017:27017'
    networks:
      - net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:3.5.26
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/test}
    ports:
      - '7474:7474'
      - '7687:7687'
    networks:
      - net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  people:
    build:
      context: ./src/microservices
      dockerfile: People.Dockerfile
    container_name: people
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: mongodb://${MONGO_INITDB_ROOT_USERNAME:-guest}:${MONGO_INITDB_ROOT_PASSWORD:-guest}@mongo:27017/?authSource=admin
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__PublisherOnly: "true"
      RabbitMqConnection__retryCount: 5
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CensusDevSigningKeyMustBeAtLeast32CharsLong!}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
    ports:
      - '5001:8080'
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  family:
    build:
      context: ./src/microservices
      dockerfile: FamilyTree.Dockerfile
    container_name: family
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Neo4j__Uri: http://neo4j:7474/db/data
      Neo4j__Username: neo4j
      Neo4j__Password: test
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__QueueName: tree
      RabbitMqConnection__retryCount: 5
      Services__People: http://people:8080
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CensusDevSigningKeyMustBeAtLeast32CharsLong!}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
    ports:
      - '5002:8080'
    networks:
      - net
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  stats:
    build:
      context: ./src/microservices
      dockerfile: Statistics.Dockerfile
    container_name: statistics
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: mongodb://${MONGO_INITDB_ROOT_USERNAME:-guest}:${MONGO_INITDB_ROOT_PASSWORD:-guest}@mongo:27017/?authSource=admin
      RabbitMqConnection__HostName: rabbitmq
      RabbitMqConnection__Username: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMqConnection__Password: ${RABBITMQ_DEFAULT_PASS:-guest}
      RabbitMqConnection__QueueName: statistics
      RabbitMqConnection__retryCount: 5
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CensusDevSigningKeyMustBeAtLeast32CharsLong!}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
    ports:
      - '5003:8080'
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity:
    build:
      context: ./src/microservices
      dockerfile: Identity.Dockerfile
    container_name: identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: mongodb://${MONGO_INITDB_ROOT_USERNAME:-guest}:${MONGO_INITDB_ROOT_PASSWORD:-guest}@mongo:27017/identitydb?authSource=admin
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CensusDevSigningKeyMustBeAtLeast32CharsLong!}
      Jwt__Issuer: ${JWT__Issuer:-census-identity}
      Jwt__Audience: ${JWT__Audience:-census-api}
      Identity__Admin__Email: ${Identity__Admin__Email:-admin@censo.local}
      Identity__Admin__Password: ${Identity__Admin__Password:-Admin@12345}
    ports:
      - '5004:8080'
    networks:
      - net
    depends_on:
      mongo:
        condition: service_healthy

  front:
    build:
      context: ./src/frontend/Census.WebApp
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - net
    depends_on:
      - identity
      - people
      - family
      - stats

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'
      - '8889:8889'
    networks:
      - net

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - net

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.4
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3000:3000'
    networks:
      - net

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - '16686:16686'
      - '4318:4318'
    networks:
      - net

networks:
  net:
    name: census
